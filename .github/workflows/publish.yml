name: Publish package

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish-rtl-analyzer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up supported npm
        run: npm install --global npm@11.5.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/rtl-analyzer/package.json').version")
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          test "$NORMALIZED_TAG" = "$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Typecheck RTL scan
        run: npm run rtl:scan:typecheck

      - name: Build RTL scan
        run: npm run rtl:scan:build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test RTL scan
        run: npm run rtl:scan:test

      - name: Test CLI preview and dependency startup
        run: npm run rtl:overlay:test

      - name: Validate package
        run: npm run rtl:cli:package:smoke

      - name: Prevent republishing an existing version
        working-directory: packages/rtl-analyzer
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          set +e
          VIEW_OUTPUT=$(npm view "rtl-analyzer@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org 2>&1)
          VIEW_STATUS=$?
          set -e

          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo "rtl-analyzer@$PACKAGE_VERSION already exists on npm"
            exit 1
          fi

          if ! printf '%s\n' "$VIEW_OUTPUT" | grep -q 'E404'; then
            echo "Could not verify whether rtl-analyzer@$PACKAGE_VERSION exists on npm"
            printf '%s\n' "$VIEW_OUTPUT"
            exit 1
          fi

      - name: Select npm dist-tag
        id: dist-tag
        working-directory: packages/rtl-analyzer
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # Prerelease versions (semver with a "-" suffix) go to "next" so the stable "latest" tag never moves to a prerelease.
          case "$PACKAGE_VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "Publishing rtl-analyzer@$PACKAGE_VERSION under dist-tag $DIST_TAG"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with OIDC
        working-directory: packages/rtl-analyzer
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Verify published version and dist-tag
        working-directory: packages/rtl-analyzer
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # npm can take several minutes to expose a new version. One shared deadline of 10 minutes covers both checks.
          DEADLINE=$(( $(date +%s) + 600 ))

          # 1. Is the version visible at all? If not, the publish did not land or is still processing.
          VISIBLE=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if VISIBLE=$(npm view "rtl-analyzer@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org 2>/dev/null) && [ "$VISIBLE" = "$PACKAGE_VERSION" ]; then break; fi
            VISIBLE=""
            sleep 10
          done
          if [ -z "$VISIBLE" ]; then
            echo "MISSING VERSION: rtl-analyzer@$PACKAGE_VERSION is not visible on npm after 10 minutes."
            echo "Check the package on npmjs.com. Do not republish from this workflow."
            exit 1
          fi

          # 2. Does the expected dist-tag point at this version? This is reported separately from a missing version.
          # The tag is always checked at least once, then polled until the shared deadline.
          while true; do
            TAGGED=$(npm view "rtl-analyzer@$DIST_TAG" version --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [ "$TAGGED" = "$PACKAGE_VERSION" ]; then break; fi
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then break; fi
            sleep 10
          done
          if [ "$TAGGED" != "$PACKAGE_VERSION" ]; then
            echo "WRONG DIST-TAG: '$DIST_TAG' points to '${TAGGED:-nothing}', expected $PACKAGE_VERSION."
            echo "Correct the tag with npm dist-tag. Do not republish from this workflow."
            exit 1
          fi

          # 3. A prerelease must never be the stable latest tag.
          if [ "$DIST_TAG" = "next" ]; then
            LATEST=$(npm view rtl-analyzer@latest version --registry=https://registry.npmjs.org 2>/dev/null || true)
            if [ "$LATEST" = "$PACKAGE_VERSION" ]; then
              echo "WRONG DIST-TAG: prerelease $PACKAGE_VERSION must not be the latest tag."
              exit 1
            fi
            echo "next is $PACKAGE_VERSION; latest remains ${LATEST:-unknown}"
          else
            echo "latest is $PACKAGE_VERSION"
          fi
