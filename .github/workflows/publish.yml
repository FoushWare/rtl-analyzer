name: Publish package

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish-rtl-analyzer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up supported npm
        run: npm install --global npm@11.5.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/rtl-analyzer/package.json').version")
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          test "$NORMALIZED_TAG" = "$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Build RTL scan
        run: npm run rtl:scan:build

      - name: Test RTL scan
        run: npm run rtl:scan:test

      - name: Validate package
        run: npm run rtl:cli:package:smoke

      - name: Prevent republishing an existing version
        working-directory: packages/rtl-analyzer
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          set +e
          VIEW_OUTPUT=$(npm view "rtl-analyzer@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org 2>&1)
          VIEW_STATUS=$?
          set -e

          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo "rtl-analyzer@$PACKAGE_VERSION already exists on npm"
            exit 1
          fi

          if ! printf '%s\n' "$VIEW_OUTPUT" | grep -q 'E404'; then
            echo "Could not verify whether rtl-analyzer@$PACKAGE_VERSION exists on npm"
            printf '%s\n' "$VIEW_OUTPUT"
            exit 1
          fi

      - name: Publish to npm with OIDC
        working-directory: packages/rtl-analyzer
        run: npm publish --access public
