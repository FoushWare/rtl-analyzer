name: Publish package

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish-rtl-analyzer
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up supported npm
        run: npm install --global npm@11.5.1

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/rtl-analyzer/package.json').version")
          NORMALIZED_TAG="${RELEASE_TAG#v}"
          test "$NORMALIZED_TAG" = "$PACKAGE_VERSION" || {
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION"
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify toolchain
        run: |
          node --version
          npm --version

      - name: Typecheck RTL scan
        run: npm run rtl:scan:typecheck

      - name: Build RTL scan
        run: npm run rtl:scan:build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test RTL scan
        run: npm run rtl:scan:test

      - name: Validate package
        run: npm run rtl:cli:package:smoke

      - name: Prevent republishing an existing version
        working-directory: packages/rtl-analyzer
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          set +e
          VIEW_OUTPUT=$(npm view "rtl-analyzer@$PACKAGE_VERSION" version --registry=https://registry.npmjs.org 2>&1)
          VIEW_STATUS=$?
          set -e

          if [ "$VIEW_STATUS" -eq 0 ]; then
            echo "rtl-analyzer@$PACKAGE_VERSION already exists on npm"
            exit 1
          fi

          if ! printf '%s\n' "$VIEW_OUTPUT" | grep -q 'E404'; then
            echo "Could not verify whether rtl-analyzer@$PACKAGE_VERSION exists on npm"
            printf '%s\n' "$VIEW_OUTPUT"
            exit 1
          fi

      - name: Select npm dist-tag
        id: dist-tag
        working-directory: packages/rtl-analyzer
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          # Prerelease versions (semver with a "-" suffix) go to "next" so the stable "latest" tag never moves to a prerelease.
          case "$PACKAGE_VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "Publishing rtl-analyzer@$PACKAGE_VERSION under dist-tag $DIST_TAG"
          echo "tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Publish to npm with OIDC
        working-directory: packages/rtl-analyzer
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: npm publish --access public --tag "$DIST_TAG"

      - name: Verify dist-tags after publish
        working-directory: packages/rtl-analyzer
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          for attempt in 1 2 3 4 5; do
            if TAGGED=$(npm view "rtl-analyzer@$DIST_TAG" version --registry=https://registry.npmjs.org 2>/dev/null) && [ "$TAGGED" = "$PACKAGE_VERSION" ]; then break; fi
            sleep 10
          done
          test "$TAGGED" = "$PACKAGE_VERSION" || { echo "dist-tag $DIST_TAG does not point to $PACKAGE_VERSION"; exit 1; }
          if [ "$DIST_TAG" = "next" ]; then
            LATEST=$(npm view rtl-analyzer@latest version --registry=https://registry.npmjs.org)
            test "$LATEST" != "$PACKAGE_VERSION" || { echo "prerelease $PACKAGE_VERSION must not become latest"; exit 1; }
            echo "latest remains $LATEST"
          fi
